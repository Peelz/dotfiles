#--------------------------------------------------
# ENV
#--------------------------------------------------

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

#--------------------------------------------------
#  Plugins
#--------------------------------------------------
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'Alkindi42/tmux-bitwarden'
set -g @plugin 'tmux-plugins/tmux-cpu'


#--------------------------------------------------
# Base
#--------------------------------------------------
unbind C-b
set -g prefix C-g

setw -g mode-keys vi

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"
# set-option -sa terminal-features ',xterm-256color:RGB'

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

set-option -g mouse on


#--------------------------------------------------
# Bind
#--------------------------------------------------

# Reload configure
bind r source-file "$HOME/.tmux.conf" \; display-message "Config reloaded"

bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# rename curent window
bind C-w command-prompt -I "#W" "rename-window '%%'" 

# rename curent window
bind C-t command-prompt -I "#W" "rename-session '%%'" 

# Pop-up
bind -n M-o if-shell '[ "#{session_name}" = "popup" ]' 'detach-client' 'display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s popup"'

# Window
bind -n M-H previous-window
bind -n M-L next-window

#--------------------------------------------------
# Bitwarden
#--------------------------------------------------
set -g @bw-session 'BW_SESSION'
set -g @bw-copy-to-clipboard 'on'

#--------------------------------------------------
# Session 
#--------------------------------------------------
set -g @sessionx-bind 'm'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'
# set -g @sessionx-x-path '~/dotfiles'

set -g @continuum-restore 'on'

set -s set-clipboard on

#--------------------------------------------------
#  Style
#--------------------------------------------------
# Catppuccin
set -g status-position top

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded" # basic, rounded, slanted, custom, or none
set -g @catppuccin_window_current_status_style "rounded" # basic, rounded, slanted, custom, or none


set -g @catppuccin_window_current_text " #W"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_number_position "left"

# , , , 
# set -g status-left '#[fg=teal,bg=default]#[fg=white,bg=teal]#{E:@catppuccin_directory_text}#[fg=teal,bg=default]#[default] '
set -g status-left ' '

set -g window-status-current-format "#[bold,fg=#89b4fa] #W #[default]"
set -g window-status-format " #W "

set -g status-right-length 100
set -g status-left-length 100

set -gF status-right "#{E:@catppuccin_status_cpu}"
set -ga status-right "#{E:@catppuccin_status_application}"

set -ga status-right "#{E:@catppuccin_status_session}"
set -ga status-right "#{E:@catppuccin_status_uptime}"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

#--------------------------------------------------
# Install/Execute tpm
#--------------------------------------------------

if-shell "[ ! -d $HOME/.config/tmux/plugins/tpm ]" \
    "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm $HOME/.config/tmux/plugins/tpm'"

if-shell "[ -f $HOME/.config/tmux/plugins/tpm/tpm ]" \
    "run '$HOME/.config/tmux/plugins/tpm/tpm'"


set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'


set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'


