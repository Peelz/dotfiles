# ==================================================
# TMUX Configuration
# ==================================================
# Personal tmux configuration with vim-style keybindings,
# catppuccin theme, and session management plugins

# ==================================================
# Environment & Plugin Manager
# ==================================================

# Set plugin installation directory
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

# Install TPM (Tmux Plugin Manager) if not already installed
if-shell "[ ! -d $HOME/.config/tmux/plugins/tpm ]" \
    "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm $HOME/.config/tmux/plugins/tpm'"

# ==================================================
# General Settings
# ==================================================

# Change prefix from Ctrl-b to Ctrl-g
unbind C-b
set -g prefix C-g

# Use vi-style key bindings in copy mode
setw -g mode-keys vi

# Enable 256 color support and true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"

# Start window and pane numbering at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set-option -g renumber-windows on

# Enable mouse support (scrolling, pane selection, etc.)
set-option -g mouse on

# Enable clipboard integration
set -s set-clipboard on

# ==================================================
# Key Bindings
# ==================================================

# Reload configuration file
bind r source-file "$HOME/.tmux.conf" \; display-message "Config reloaded"

# Open new windows/panes in current directory
bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Window management key table (prefix + w)
# Use custom key table for window operations
bind w switch-client -T window_mode
bind -T window_mode r command-prompt -I "#W" "rename-window '%%'"
bind -T window_mode n new-window
bind -T window_mode x kill-window
bind -T window_mode w choose-tree -w
bind -T window_mode l choose-tree -w -F "#{?window_format,#[fg=cyan]#{window_name}#[fg=magenta]#{?window_zoomed_flag, [ZOOMED],},}"

# Session management key table (prefix + s)
# Use custom key table for session operations
bind s switch-client -T session_mode
bind -T session_mode r command-prompt -I "#S" "rename-session '%%'"
bind -T session_mode n new-session
bind -T session_mode x kill-session
bind -T session_mode s choose-tree -s
bind -T session_mode l choose-tree -s -F "#{?session_format,#[fg=green]#{session_name} #[fg=white](#{session_windows} windows),}"

# Toggle popup terminal with Alt-o
# If already in popup session, detach; otherwise create/attach to popup session
bind -n M-o if-shell '[ "#{session_name}" = "popup" ]' \
    'detach-client' \
    'display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s popup"'

# Quick window navigation with Alt-H/L
bind -n M-H previous-window
bind -n M-L next-window

# ==================================================
# Plugin Declarations
# ==================================================

set -g @plugin 'tmux-plugins/tmux-sensible'      # Sensible default settings
set -g @plugin 'omerxx/tmux-sessionx'            # Session management with fuzzy finder
set -g @plugin 'tmux-plugins/tmux-resurrect'     # Save/restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-continuum'     # Automatic session save/restore
set -g @plugin 'catppuccin/tmux'                 # Catppuccin theme
set -g @plugin 'tmux-plugins/tmux-yank'          # Copy to system clipboard
set -g @plugin 'Alkindi42/tmux-bitwarden'        # Bitwarden integration
set -g @plugin 'tmux-plugins/tmux-cpu'           # Display CPU usage in status bar
set -g @plugin 'jaclu/tmux-menus'                # menus

# ==================================================
# Plugin Configuration
# ==================================================

# Bitwarden Plugin
# Environment variable for Bitwarden session
set -g @bw-session 'BW_SESSION'
set -g @bw-copy-to-clipboard 'on'

# SessionX Plugin
# Fuzzy session finder with zoxide integration
set -g @sessionx-bind 'm'                        # Bind to prefix + m
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'                # Enable zoxide integration
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'

# Resurrect & Continuum Plugins
# Automatically restore sessions and save vim/nvim sessions
set -g @continuum-restore 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# FZF URL Plugin
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# ==================================================
# Visual Settings & Theme
# ==================================================

# Status bar position
set -g status-position top

# Catppuccin Theme Configuration
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"         # Style for inactive windows
set -g @catppuccin_window_current_status_style "rounded" # Style for active window

# Window labels
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_number_position "left"

# Custom window status format
# Active window: bold blue text
set -g window-status-current-format "#[bold,fg=#89b4fa] #W #[default]"
set -g window-status-format " #W "

# Status bar sizing
set -g status-right-length 100
set -g status-left-length 100

# Status bar left side (minimal)
set -g status-left ' '

# Status bar right side (CPU, application, session, uptime)
set -gF status-right "#{E:@catppuccin_status_cpu}"
set -ga status-right "#{E:@catppuccin_status_application}"
set -ga status-right "#{E:@catppuccin_status_session}"
set -ga status-right "#{E:@catppuccin_status_uptime}"

# Pane border configuration
set -g pane-border-status bottom
set -g pane-border-format "#{pane_current_path} #[align=right] #{?#{!=:#{client_key_table},root}, [#{client_key_table}] , #W} "

# Load catppuccin theme
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# ==================================================
# Initialize TPM (Tmux Plugin Manager)
# ==================================================
# Keep this at the very bottom of the config file

if-shell "[ -f $HOME/.config/tmux/plugins/tpm/tpm ]" \
    "run '$HOME/.config/tmux/plugins/tpm/tpm'"
